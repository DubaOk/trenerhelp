<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>TrenerHelp</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#efefef;font-family:system-ui,sans-serif">
        <img src="/icons/icon.svg" alt="" style="width:72px;height:72px;border-radius:20px" />
        <p style="color:#828282;font-size:15px;margin:0">Загрузка…</p>
        <p id="boot-error" style="display:none;color:#b8452f;font-size:13px;margin:0;padding:0 24px;text-align:center;word-break:break-word"></p>
      </div>
    </div>
    <script>
      // surface fatal errors instead of a silent white screen (old iOS etc.)
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-error')
        if (el) {
          el.style.display = 'block'
          el.textContent = 'Ошибка: ' + (e.message || 'не удалось загрузить приложение')
        }
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
